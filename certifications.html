<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffafa">
  <meta name="description" content="Certificates and professional learning for Erryca Bianca M. Abistado.">
  <title>Certifications | Erryca Bianca M. Abistado</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #fffafa;
      --surface: #fff;
      --tint: #fff0f0;
      --red: #d94848;
      --yellow: #fff1c9;
      --ink: #30272b;
      --muted: #6d6065;
      --line: #e8dfe0;
      background: var(--paper);
      color: var(--ink);
      font-family: Figtree, system-ui, sans-serif;
      scroll-behavior: smooth;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #0b0b0c;
      --surface: #171416;
      --tint: #251012;
      --red: #ff5964;
      --yellow: #5a2429;
      --ink: #fff8f8;
      --muted: #d6b7b9;
      --line: #3a1c20;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { display: flex; width: 100%; height: 100vh; height: 100svh; min-width: 320px; margin: 0; flex-direction: column; overflow: hidden; background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1.65; }
    a { color: inherit; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
    .wrap { width: min(1040px, calc(100% - 40px)); margin-inline: auto; }
    .site-nav { position: relative; z-index: 5; display: flex; flex: 0 0 auto; justify-content: center; padding: 0 12px; margin-top: 12px; }
    .pill { display: flex; max-width: 100%; gap: 6px; overflow-x: auto; padding: 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); box-shadow: 0 8px 28px #292a2710; scrollbar-width: none; }
    .pill::-webkit-scrollbar { display: none; }
    .pill a { padding: 8px 13px; border-radius: 999px; color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .pill a:hover, .pill a.on { background: var(--tint); color: var(--red); }
    #primary-links { display: contents; }
    .theme-toggle { padding: 7px 12px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font: 600 14px Figtree, sans-serif; cursor: pointer; white-space: nowrap; }
    .theme-toggle:hover { background: var(--tint); }
    .nav-toggle { display: none; }
    main { display: flex; min-height: 0; flex: 1; padding-block: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .certificate-gallery { display: grid; min-height: 0; flex: 1; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: minmax(0, .72fr) minmax(0, 1fr); gap: clamp(8px, 1.5vw, 18px); }
    .certificate-image { display: grid; min-width: 0; min-height: 0; overflow: hidden; place-items: center; border-radius: 12px; }
    .certificate-image img { display: block; min-width: 0; min-height: 0; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
    #ai-blockchain-2026, #tech-inductors-2023, #databiz-2025 { grid-column: span 4; }
    #batangas-it-2024, #databiz-2024 { grid-column: span 3; }
    #convergeit-2026 { grid-column: span 6; }
    #databiz-2024 { translate: 16px 0; }
    #batangas-it-2024 { translate: -16px 0; }
    .certificate-image:focus-visible { outline: 3px solid var(--red); outline-offset: 4px; }
    @media (max-width: 980px) {
      .site-nav { padding-inline: 16px; }
      .pill { display: grid; width: min(100%, 520px); grid-template-columns: minmax(0, 1fr); gap: 0; overflow: visible; padding: 8px; border-radius: 16px; }
      .pill #primary-links { display: none; }
      .pill.nav-open #primary-links { display: grid; grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding-top: 6px; }
      .pill #primary-links a { display: flex; min-height: 42px; align-items: center; justify-content: center; padding: 8px 10px; text-align: center; white-space: normal; }
      .pill #primary-links .theme-toggle { grid-column: 1 / -1; min-height: 42px; padding: 8px 10px; }
      .nav-toggle { display: flex; min-height: 42px; align-items: center; justify-content: center; gap: 9px; width: 100%; padding: 9px 12px; border: 1px solid var(--red); border-radius: 11px; background: var(--tint); color: var(--ink); font: 600 14px Figtree, sans-serif; cursor: pointer; }
      .nav-toggle::before { width: 16px; height: 12px; background: linear-gradient(to bottom, var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 7px, transparent 7px 10px, var(--ink) 10px 12px); content: ""; }
    }
    @media (max-width: 680px) {
      .wrap { width: min(100% - 28px, 520px); }
      .site-nav { margin-top: 8px; }
      .certificate-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 8px; }
      #ai-blockchain-2026, #tech-inductors-2023, #databiz-2025, #batangas-it-2024, #databiz-2024, #convergeit-2026 { grid-column: auto; translate: none; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main">
    <div class="pill">
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-links">Menu</button>
      <span id="primary-links">
        <a href="index.html#intro">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#skills">Skills</a>
        <a href="index.html#project">Project</a>
        <a href="index.html#experience">Experience</a>
        <a href="index.html#certs">Seminars</a>
        <a href="index.html#certifications" aria-current="page">Certifications</a>
        <a href="index.html#contact">Contact</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button>
      </span>
    </div>
  </nav>
  <main class="wrap" aria-label="Certificates">
    <h1 class="sr-only">Certifications</h1>
    <div class="certificate-gallery">
      <a class="certificate-image" id="ai-blockchain-2026" href="assets/ai-blockchain-2026-certificate.png" target="_blank" rel="noopener noreferrer" aria-label="Open the AI and Blockchain 2026 certificate image">
        <img src="assets/ai-blockchain-2026-certificate.png" alt="Certificate of participation awarded to Erryca Bianca Abistado for the Batangas Information Technology Conference 2026">
      </a>
      <a class="certificate-image" id="tech-inductors-2023" href="assets/tech-inductors-2023-certificate.png" target="_blank" rel="noopener noreferrer" aria-label="Open the Scratchlogics 2023 certificate image">
        <img src="assets/tech-inductors-2023-certificate.png" alt="Landscape certificate of participation awarded to Erryca Bianca Abistado for Scratchlogics: Unraveling the Secrets of Programming">
      </a>
      <a class="certificate-image" id="databiz-2025" href="assets/databiz-2025-certificate.png" target="_blank" rel="noopener noreferrer" aria-label="Open the DATABIZ 2025 certificate image">
        <img src="assets/databiz-2025-certificate.png" alt="Certificate of participation awarded to Erryca Bianca Abistado for the DATABIZ 2025 Conference">
      </a>
      <a class="certificate-image" id="databiz-2024" href="assets/databiz-2024-certificate.png" target="_blank" rel="noopener noreferrer" aria-label="Open the DATABIZ 2024 certificate image">
        <img src="assets/databiz-2024-certificate.png" alt="Certificate of participation awarded to Erryca Bianca Abistado for the Data Biz Conference 2024">
      </a>
      <a class="certificate-image" id="convergeit-2026" href="assets/convergeit-2026-certificate.png" target="_blank" rel="noopener noreferrer" aria-label="Open the ConvergeIT 2026 certificate image">
        <img src="assets/convergeit-2026-certificate.png" alt="ConvergeIT 2026 certificate of participation awarded to Erryca Bianca Abistado">
      </a>
      <a class="certificate-image" id="batangas-it-2024" href="assets/batangas-it-2024-certificate.png" target="_blank" rel="noopener noreferrer" aria-label="Open the Batangas Information Technology Conference 2024 certificate image">
        <img src="assets/batangas-it-2024-certificate.png" alt="Certificate of participation awarded to Erryca Bianca Abistado for the Batangas Information Technology Conference 2024">
      </a>
    </div>
  </main>
  <script>
    (function () {
      var root = document.documentElement;
      var button = document.getElementById('theme-toggle');
      var navPill = document.querySelector('.pill');
      var navToggle = document.querySelector('.nav-toggle');
      var themeColor = document.querySelector('meta[name="theme-color"]');
      var savedTheme = null;
      try { savedTheme = localStorage.getItem('erryca-theme'); } catch (error) {}
      var setTheme = function (theme) {
        var dark = theme === 'dark';
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        button.textContent = dark ? 'Light mode' : 'Dark mode';
        button.setAttribute('aria-label', 'Switch to ' + (dark ? 'light' : 'dark') + ' mode');
        button.setAttribute('aria-pressed', String(dark));
        themeColor.setAttribute('content', dark ? '#0b0b0c' : '#fffafa');
      };
      setTheme(savedTheme === 'dark' ? 'dark' : 'light');
      button.addEventListener('click', function () {
        var theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        setTheme(theme);
        try { localStorage.setItem('erryca-theme', theme); } catch (error) {}
      });
      navToggle.addEventListener('click', function () {
        var open = navPill.classList.toggle('nav-open');
        navToggle.setAttribute('aria-expanded', String(open));
      });
      navPill.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
          navPill.classList.remove('nav-open');
          navToggle.setAttribute('aria-expanded', 'false');
        });
      });
    }());
  </script>
</body>
</html>
